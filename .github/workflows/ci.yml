name: TECHCORP Security CI

on:
  push:
  pull_request:
    branches: [main]

# Principe du moindre privilège : le GITHUB_TOKEN ne peut que lire le code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Outils de sécurité exécutés via leurs images Docker officielles, à version figée
# (pas d'action tierce à droits étendus). Amélioration : figer aussi par digest @sha256.
env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.21.2
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  tests:
    name: Tests Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # GATE : tout secret détecté dans le code livré bloque la PR (exit-code 1).
      # --redact : la valeur trouvée n'apparaît jamais en clair dans les logs CI.
      - name: Gitleaks — analyse de l'arborescence livrée
        run: |
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            detect --source /repo --no-git --redact --verbose \
            --report-format json --report-path /repo/gitleaks-report.json --exit-code 1
      - name: Rapport Gitleaks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

  dependencies:
    name: Dépendances (Trivy fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # GATE : CRITICAL/HIGH disposant d'un correctif => blocage.
      - name: Trivy — vulnérabilités des dépendances
        run: |
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" fs \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /src/.trivyignore --exit-code 1 /src
      # Information (non bloquant) : erreurs de configuration Dockerfile / compose.
      - name: Trivy — mauvaises configurations (informatif)
        run: |
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" config \
            --severity HIGH,CRITICAL --exit-code 0 /src

  image:
    name: Image Docker (build + Trivy image)
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Docker build
        run: docker build -t techcorp-api:ci .
      # GATE : CRITICAL/HIGH corrigeables dans l'image (système + paquets Python) => blocage.
      # Le socket Docker est monté uniquement dans ce job CI éphémère, jamais dans un conteneur IA.
      - name: Trivy — vulnérabilités de l'image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/.trivyignore:ro" "$TRIVY_IMAGE" image \
            --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /.trivyignore \
            --exit-code 1 techcorp-api:ci
      - name: Rapport complet (informatif, toutes sévérités)
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --severity LOW,MEDIUM,HIGH,CRITICAL --exit-code 0 techcorp-api:ci | tee trivy-image.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-report
          path: trivy-image.txt
          if-no-files-found: ignore
